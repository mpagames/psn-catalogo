<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSN — Catálogo</title>
<meta name="description" content="Letrinhas personalizadas, caixetas e bichinhos impressos em 3D. Faça seu pedido pelo WhatsApp.">
<meta name="theme-color" content="#2E1A47">
<meta property="og:title" content="PSN — Catálogo">
<meta property="og:description" content="Peças impressas em 3D, camada por camada. Escolha e peça pelo WhatsApp.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
:root{--lado:clamp(14px,3.2vw,56px);--roxo:#6B3FA0;--roxo2:#8A5FC4;--escuro:#2E1A47;--verde:#2FA84F;--creme:#FFF6E5;--lilas:#E4D9F2;--suave:#6d6280;--borda:#eadff5;--raio:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--creme);color:var(--escuro);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}

/* topo */
header{position:sticky;top:0;z-index:30;background:var(--escuro);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.topo{margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px var(--lado);padding-top:max(10px,env(safe-area-inset-top))}
.logo{height:52px;background:var(--creme);border-radius:12px;padding:3px 9px}
.busca{flex:1;display:flex;align-items:center;background:#fff;border-radius:999px;padding:0 14px;max-width:460px;margin-left:auto}
.busca input{border:0;outline:0;padding:11px 8px;width:100%;background:transparent;min-width:0}
.btn-carrinho{background:var(--verde);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
.btn-carrinho b{background:#fff;color:var(--verde);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.85rem;padding:0 6px}
@media(max-width:640px){.topo{flex-wrap:wrap;row-gap:8px;padding-bottom:10px}.logo{height:42px}.busca{order:3;flex-basis:100%;max-width:none;margin:0}.btn-carrinho{margin-left:auto}.btn-carrinho span{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;margin:0 auto;padding:34px var(--lado) 18px}
.hero h1{font-size:clamp(1.9rem,5.5vw,3rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.5px}
.hero h1 .a{color:var(--roxo)} .hero h1 .b{color:var(--verde)} .hero h1 .c{color:var(--roxo2)}
.hero p{max-width:560px;color:var(--suave);font-size:1.05rem;margin:0}
.bolha{position:absolute;border-radius:50%;z-index:-1}
/* formas orgânicas no fundo da página (ficam atrás de tudo) */
body{position:relative;z-index:0;overflow-x:hidden}
.formas{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.forma{position:absolute;display:block;height:auto}
@media(max-width:640px){.forma{transform:scale(.7)}}
.aviso-teste{margin:0 auto 6px;padding:0 var(--lado)}
.aviso-teste div{background:#FFF1BF;color:#5b4300;border-radius:12px;padding:10px 14px;font-size:.9rem}

/* filtros */
.secao{margin:0 auto;padding:10px var(--lado) 40px}
.secao h2{font-size:1.5rem;margin:8px 0 2px}
.secao .sub{color:var(--suave);margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:2px solid var(--borda);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;color:var(--escuro)}
.chip.ativo{background:var(--roxo);border-color:var(--roxo);color:#fff}
.busca-movel{display:none;background:#fff;border-radius:999px;padding:0 14px;margin-bottom:10px;align-items:center;border:2px solid var(--borda)}
.busca-movel input{border:0;outline:0;padding:11px 8px;width:100%;background:transparent}
@media(max-width:640px){.busca-movel{display:flex}}

/* cards */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
@media(max-width:620px){.grade{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--raio);box-shadow:0 4px 18px rgba(46,26,71,.08);overflow:hidden;display:flex;flex-direction:column}
.galeria{position:relative;aspect-ratio:1/1;background:#f3eefa}
.galeria img{width:100%;height:100%;object-fit:cover}
.galeria.retrato{aspect-ratio:3/4;background:#FCF6EE}
.galeria.retrato img{object-fit:contain;position:absolute;inset:0}
/* no celular a foto fica um pouco mais baixa, para a foto e as cores caberem juntas na tela */
@media(max-width:640px){.galeria.retrato{aspect-ratio:10/9}.galeria.retrato img{object-fit:cover;object-position:center 52%}.galeria.retrato img.inteira{object-fit:contain}}
/* banner do topo (capas passando sozinhas) */
.banner{position:relative;margin:4px var(--lado) 22px;border-radius:24px;overflow:hidden;box-shadow:0 6px 24px rgba(46,26,71,.10)}
.banner .trilho{display:flex;transition:transform .6s ease}
.banner .slide{flex:0 0 100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:center;gap:clamp(14px,3vw,40px);padding:clamp(16px,3vw,36px);border:0;text-align:left;cursor:pointer;color:var(--escuro)}
.banner .txt h2{font-size:clamp(1.5rem,3.4vw,2.6rem);line-height:1.05;margin:0 0 10px;color:var(--roxo)}
.banner .txt p{margin:0 0 16px;color:#4d4060;font-size:clamp(.95rem,1.4vw,1.15rem)}
.banner .txt span{display:inline-block;background:var(--roxo);color:#fff;font-weight:800;border-radius:999px;padding:10px 18px}
.banner .foto{aspect-ratio:3/2;border-radius:18px;overflow:hidden;background:#FCF3EA}
.banner .foto img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.banner .pontos-b{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px}
.banner .pontos-b button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(46,26,71,.25)}
.banner .pontos-b button.on{background:var(--roxo);width:22px;border-radius:9px}
@media(max-width:640px){.banner .slide{grid-template-columns:1fr;padding:12px 12px 30px}.banner .foto{order:-1}.banner .txt p{margin-bottom:12px}}
/* atalhos com capa (topo) */
.atalhos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,calc((100% - 56px) / 5));gap:14px;overflow-x:auto;padding:4px var(--lado) 18px;scroll-snap-type:x mandatory;scroll-padding-inline:var(--lado);scrollbar-width:none;margin-top:-4px}
.atalhos::-webkit-scrollbar{display:none}
.atalho{scroll-snap-align:start;border:0;padding:0;background:#fff;border-radius:var(--raio);overflow:hidden;text-align:left;box-shadow:0 4px 18px rgba(46,26,71,.08);display:flex;flex-direction:column;outline:3px solid transparent;transition:outline-color .15s, transform .15s}
.atalho:hover{transform:translateY(-2px)}
.atalho.on{outline-color:var(--roxo)}
.atalho .img{aspect-ratio:4/3;background:#FCF3EA;overflow:hidden}
.atalho img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.atalho .vazio{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#efe6f8,#fcf3ea);color:var(--roxo);font-weight:800;letter-spacing:.5px}
.atalho b{padding:12px 14px 2px;font-size:1.02rem;color:var(--escuro)}
.atalho small{padding:0 14px 12px;color:var(--suave);font-size:.82rem}
@media(max-width:640px){.atalhos{grid-auto-columns:72%}}
/* capa da seção / categoria */
.capa{margin:2px 0 16px;border-radius:var(--raio);overflow:hidden;background:#FDF3E8;height:clamp(170px,30vw,420px);box-shadow:0 4px 18px rgba(46,26,71,.08)}
.capa img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.capa.inteira{background:#FCF3EA}
.capa.inteira img{object-fit:contain}
.capa[hidden]{display:none}
.galeria .seta{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:1.3rem;font-weight:800;color:var(--escuro);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.galeria .ant{left:10px}.galeria .prox{right:10px}
.galeria .pontos{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.galeria .pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.galeria .pontos i.on{background:#fff;width:18px;border-radius:4px}
.galeria .pontos .cont{background:rgba(46,26,71,.6);color:#fff;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px}
.galeria .tag{position:absolute;top:12px;left:12px;background:var(--roxo);color:#fff;font-size:.75rem;font-weight:800;border-radius:999px;padding:4px 10px}
.corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.corpo h3{margin:0;font-size:1.15rem}
.corpo .desc{margin:0;color:var(--suave);font-size:.92rem;line-height:1.4}
.preco{font-size:1.35rem;font-weight:800;color:var(--roxo)}
.preco small{font-size:.85rem;font-weight:600;color:var(--suave)}
.op-nome{font-size:.8rem;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.op-nome b{color:var(--escuro);text-transform:none;letter-spacing:0;font-size:.9rem}
.valores{display:flex;flex-wrap:wrap;gap:6px}
.val{border:2px solid var(--borda);background:#fff;border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.val.on{border-color:var(--roxo);background:#f4eefc}
.val .bol{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.val.cor{padding:4px;border-radius:50%}
.val.cor .bol{width:26px;height:26px}
.tecla{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-weight:900;font-size:1rem;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.12)}
.val.combo{padding:4px;border-radius:12px}
.val.combo .tecla{width:34px;height:34px}
.nome-in{width:100%;border:2px solid var(--borda);border-radius:12px;padding:11px 12px;font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;outline:0}
.nome-in:focus{border-color:var(--roxo2)}
.previa{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;align-items:center;padding:8px;background:#faf7fd;border-radius:12px}
.previa .tecla{width:30px;height:30px;font-size:1.05rem}
.dica{flex-basis:100%;font-size:.82rem;color:var(--suave);margin-top:4px}
.link{background:none;border:0;color:var(--roxo);font-weight:700;text-decoration:underline;padding:0;font-size:.82rem}
.cx{border:0;display:inline-grid;place-items:center;padding:5px;border-radius:10px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.08)}
.previa .vazio{color:#b9abc9;font-size:.9rem}
.rodape-card{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:4px}
.qtd{display:flex;align-items:center;border:2px solid var(--borda);border-radius:999px;overflow:hidden}
.qtd button{width:38px;height:40px;border:0;background:transparent;font-size:1.3rem;font-weight:800;color:var(--roxo)}
.qtd span{min-width:28px;text-align:center;font-weight:800}
.add{flex:1;border:0;border-radius:999px;background:var(--roxo);color:#fff;font-weight:800;padding:12px 14px;font-size:.98rem}
.add:active{transform:scale(.98)}
.add.ok{background:var(--verde)}

/* carrinho */
.fundo{position:fixed;inset:0;background:rgba(46,26,71,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--creme);z-index:50;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.gaveta.on{transform:none}
.gaveta .cab{display:flex;align-items:center;justify-content:space-between;padding:16px;padding-top:max(16px,env(safe-area-inset-top));background:var(--escuro);color:#fff}
.gaveta .cab h2{margin:0;font-size:1.2rem}
.fechar{background:transparent;border:0;color:#fff;font-size:1.6rem;line-height:1}
.itens{flex:1;overflow:auto;padding:12px 16px}
.item{display:flex;gap:12px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.item img{width:62px;height:62px;border-radius:10px;object-fit:cover;flex-shrink:0}
.item .info{flex:1;min-width:0}
.item .info b{display:block}
.item .info small{color:var(--suave);display:block;line-height:1.3}
.item .lado{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .qtd button{width:30px;height:30px;font-size:1.1rem}
.item .remover{background:transparent;border:0;color:#C62828;font-size:.8rem;font-weight:700;padding:0}
.vazio-carr{text-align:center;color:var(--suave);padding:40px 10px}
.fim{padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--borda)}
/* carrinho: a gaveta inteira rola (lista + resumo + dados), e o botão de enviar fica sempre visível embaixo */
#gaveta{overflow-y:auto;-webkit-overflow-scrolling:touch}
#gaveta .itens{flex:0 0 auto;overflow:visible}
#gaveta .cab{position:sticky;top:0;z-index:2}
#gaveta .fim{flex:1 0 auto}
#gaveta.on .enviar{position:fixed;right:16px;bottom:max(12px,env(safe-area-inset-bottom));width:calc(min(440px,100%) - 32px);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#gaveta.on .fim{padding-bottom:86px}
.linha-tot span:last-child,.total span:last-child{white-space:nowrap;padding-left:10px}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin-bottom:10px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:.85rem;font-weight:700;color:var(--suave)}
.campo input,.campo select,.campo textarea{border:2px solid var(--borda);border-radius:10px;padding:9px 10px;font-weight:500;color:var(--escuro);background:#fff;outline:0}
.campo textarea{resize:vertical;min-height:54px}
.enviar{width:100%;border:0;border-radius:999px;background:#25D366;color:#fff;font-weight:800;font-size:1.05rem;padding:14px;display:flex;gap:10px;align-items:center;justify-content:center}
.enviar:disabled{opacity:.5}
.nota{font-size:.8rem;color:var(--suave);text-align:center;margin:8px 0 0}

/* flutuantes */
.zap{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:20}
.barra-carr{position:fixed;left:12px;right:86px;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;display:none}
.barra-carr button{white-space:nowrap;width:100%;border:0;border-radius:999px;background:var(--roxo);color:#fff;font-weight:800;padding:15px 18px;display:flex;justify-content:space-between;box-shadow:0 6px 18px rgba(46,26,71,.3)}
@media(max-width:640px){.barra-carr.on{display:block}}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);background:var(--escuro);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* seções */
.secoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 14px}
.aba-sec{border:2px solid var(--borda);background:#fff;border-radius:16px;padding:14px 12px;justify-content:center;min-height:54px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--escuro);font-size:.92rem;text-align:center}
.aba-sec span{font-size:1.5rem}
.aba-sec small{font-size:.7rem;font-weight:700;color:var(--suave)}
.aba-sec.ativa{background:var(--roxo);border-color:var(--roxo);color:#fff}
.aba-sec.ativa small{color:#e9e1f5}
@media(max-width:480px){.secoes{grid-template-columns:repeat(3,1fr)}.aba-sec{font-size:.78rem;padding:8px 6px}}
.preco.consulta{font-size:1.05rem;color:var(--suave)}
.card.em-breve .corpo{align-items:center;text-align:center;padding:30px 20px}
/* kits e descontos */
.promo{background:#E7F6EC;color:#14532d;border-radius:14px;padding:11px 14px;font-size:.92rem;margin-bottom:12px;line-height:1.4}
.promo-mini{background:#E7F6EC;color:#14532d;border-radius:10px;padding:8px 10px;font-size:.85rem;margin:6px 0 10px}
.galeria .tag.pix{left:auto;right:12px;background:var(--verde)}
.galeria .tag.kit{background:var(--verde);font-size:.85rem}
.kit-lista{margin:0;padding-left:18px;color:var(--escuro);font-weight:600;font-size:.92rem}
.kit-intro{color:var(--suave);font-size:.92rem;margin:0 0 12px}
.card.mini{margin-bottom:12px;box-shadow:0 2px 10px rgba(46,26,71,.08)}
.kit-rot{font-size:.75rem;font-weight:800;color:#fff;background:var(--roxo2);border-radius:999px;padding:3px 10px;align-self:flex-start}
.linha-tot{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:4px;gap:10px}
.verde{color:#1E7B3A!important;font-weight:700}
.kit-modal{width:min(520px,100%)}
.kit-inclui{background:#fff;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.escolhas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.esc-prod{border:2px solid var(--borda);background:#fff;border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:.78rem;font-weight:700}
.esc-prod img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
.esc-prod.on{border-color:var(--roxo);background:#f4eefc}
.esc-prod small{color:var(--roxo);font-weight:800}
.esc-prod.sem{justify-content:center}
.val.esg{opacity:.45;position:relative}
.val.cor.esg::after{content:'';position:absolute;left:6px;right:6px;top:50%;border-top:2px solid #C62828;transform:rotate(-35deg)}
.val small{font-size:.7rem;color:#C62828;font-weight:800}
.esg-aviso{background:#FDE1E1;color:#7a1616;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:8px;line-height:1.4}
.esg-aviso .consultar,.add.consultar{display:inline-block;margin-top:6px;background:#25D366;color:#fff;font-weight:800;border-radius:999px;padding:8px 14px;text-decoration:none;text-align:center}
.add.consultar{margin-top:0;flex:1}
.esc-prod small.esg-txt{color:#C62828}
.mini-foto{border-radius:12px;overflow:hidden;background:#FCF6EE;aspect-ratio:4/3;margin:2px 0 4px}
.mini-foto img{width:100%;height:100%;object-fit:contain}
.sem-ico{font-size:1.8rem;aspect-ratio:1/1;display:grid;place-items:center;width:100%}
.esc-config .card.mini{box-shadow:none;margin:0;background:#faf7fd}
.esc-config .card.mini .kit-rot{display:none}
footer{text-align:center;color:var(--suave);padding:20px 16px 110px;font-size:.9rem}
footer a{color:var(--roxo);font-weight:700}
</style>
</head>
<body>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const CHAVE = 'psn_catalogo_carrinho', CHAVE_CLI = 'psn_catalogo_cliente';
const DP = typeof DESCONTO_PIX !== 'undefined' ? DESCONTO_PIX : { formas: [], faixas: [] };
const LISTA_KITS = typeof KITS !== 'undefined' ? KITS : [];

let carrinho = [];
try { carrinho = JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { carrinho = []; }
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(carrinho)); } catch (e) {} };
let cliente = {};
try { cliente = JSON.parse(localStorage.getItem(CHAVE_CLI)) || {}; } catch (e) { cliente = {}; }
const salvarCli = () => { try { localStorage.setItem(CHAVE_CLI, JSON.stringify(cliente)); } catch (e) {} };
const LISTA_SECOES = typeof SECOES !== 'undefined' ? SECOES : [{ id: 'todos', nome: 'Tudo' }];
const secaoDaCat = id => (CATEGORIAS.find(c => c.id === id) || {}).secao || LISTA_SECOES[0].id;
const secaoDoKit = k => k.secao || LISTA_SECOES[0].id;
let secao = LISTA_SECOES.some(x => x.id === decodeURIComponent(location.hash.slice(1))) ? decodeURIComponent(location.hash.slice(1)) : LISTA_SECOES[0].id;
let filtro = 'todos', busca = '';
const estado = {};   // por produto: { foto, qtd, escolhas:{}, nome, combo, cx }
const PROD = {};     // id → produto (inclui as peças dentro dos kits)
for (const p of PRODUTOS) PROD[p.id] = p;
const prod = id => PROD[id];

function st(p) {
  if (!estado[p.id]) {
    const esc0 = {};
    for (const o of p.opcoes || []) esc0[o.nome] = null;
    estado[p.id] = { foto: 0, qtd: 1, escolhas: esc0, nome: '', combo: 0, cx: [], modelo: 0 };
  }
  return estado[p.id];
}
const limparNome = t => String(t).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z ]/g, '');
const tecla = (l, base, letra) => `<span class="tecla" style="background:${base};color:${letra}">${esc(l)}</span>`;
const pctTxt = v => String(v).replace('.', ',') + '%';

/* ---------- desconto no Pix / dinheiro ---------- */
function faixaPara(valor) { let f = null; for (const x of DP.faixas) if (valor > x.acima && (!f || x.porcento > f.porcento)) f = x; return f; }
function proximaFaixa(valor) { return DP.faixas.filter(x => x.acima >= valor).sort((a, b) => a.acima - b.acima)[0] || null; }
const entraNoPix = x => x.kit ? !!DP.valeParaKits : !!(prod(x.pid) && prod(x.pid).descontoPix);
/* peças com preço próprio no Pix/dinheiro (precoPix): o valor muda conforme a forma de pagamento */
const unitDe = x => x.unitPix != null && DP.formas.includes(cliente.pag || DP.formas[0] || 'Pix') ? x.unitPix : x.unit;
function contas() {
  const sub = carrinho.reduce((s, x) => s + unitDe(x) * x.qtd, 0);
  const base = carrinho.filter(entraNoPix).reduce((s, x) => s + x.unit * x.qtd, 0);
  const f = faixaPara(base), prox = proximaFaixa(base);
  const pag = cliente.pag || DP.formas[0] || 'Pix';
  const vale = !!f && DP.formas.includes(pag);
  const desc = f ? Math.round(base * f.porcento) / 100 : 0;
  return { sub, base, f, prox, pag, vale, desc, total: sub - (vale ? desc : 0) };
}
/* "Faltam R$ X para ganhar 10%": soma o que já está no carrinho com o que está sendo montado */
function avisoDesconto(extra = 0) {
  if (!DP.faixas.length) return '';
  const base = carrinho.filter(entraNoPix).reduce((s, x) => s + x.unit * x.qtd, 0) + extra;
  const f = faixaPara(base), prox = proximaFaixa(base), formas = formasTxt();
  if (prox) { const falta = Math.max(0.01, Math.round((prox.acima - base) * 100) / 100);
    return `<div class="promo-mini">✨ Faltam <b>${R(falta)}</b> para você ganhar <b>${pctTxt(prox.porcento)} de desconto</b> no ${esc(formas)}.</div>`; }
  if (f) return `<div class="promo-mini">🎉 Seu pedido ganhou <b>${pctTxt(f.porcento)} de desconto</b> no ${esc(formas)}!</div>`;
  return '';
}
const formasTxt = () => DP.formas.map(f => f === 'Pix' ? f : f.toLowerCase()).join(' ou ');
const todosNoPix = () => PRODUTOS.every(p => p.descontoPix || p.oculto) && (DP.valeParaKits || !LISTA_KITS.length);
/* o desconto é descrito pelas seções onde ele vale (ex.: "chaveiros e clickers") */
const nomesPix = () => LISTA_SECOES.filter(x => PRODUTOS.some(p => p.descontoPix && !p.oculto && secaoDaCat(p.cat) === x.id)).map(x => x.nome.toLowerCase()).join(' e ');

/* ---------- cards ---------- */
function cardHtml(p) {
  const s = st(p), kit = !!p.kitRotulo;
  const fotos = p.fotos || [];
  const f = fotos[s.foto] || fotos[0];
  let h = kit ? `<article class="card mini" data-p="${p.id}"><div class="corpo"><div class="kit-rot">${esc(p.kitRotulo)}</div><h3>${esc(p.nome)}</h3>`
    : `<article class="card" data-p="${p.id}"><div class="galeria${p.formato === 'retrato' ? ' retrato' : ''}">${f ? `<img src="fotos/${esc(f)}" alt="${esc(p.nome)}" loading="lazy"${ehInteira(f) ? ' class="inteira"' : ''}>` : ''}
    ${p.tipo === 'nome' ? '<span class="tag">Personalizado</span>' : ''}
    ${fotos.length > 1 ? `<button class="seta ant" data-a="foto" data-d="-1" aria-label="Foto anterior">‹</button><button class="seta prox" data-a="foto" data-d="1" aria-label="Próxima foto">›</button>
      <div class="pontos">${fotos.length > 8 ? `<span class="cont">${s.foto + 1}/${fotos.length}</span>` : fotos.map((_, i) => `<i class="${i === s.foto ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>
    <div class="corpo"><h3>${esc(p.nome)}</h3><p class="desc">${esc(p.descricao || '')}</p>`;
  h += kit ? (p.tipo === 'nome' ? `<div class="desc">1 letra inclusa no kit · <b>+ ${R(p.kitLetraAdicional)}</b> cada letra a mais</div>` : '')
    : p.preco == null ? `<div class="preco consulta">Preço sob consulta</div>` : p.precoPix != null ? `<div class="preco">${R(p.precoPix)} <small>no ${esc(formasTxt())}</small></div><div class="desc">ou <b>${R(p.preco)}</b> no cartão</div>`
    : `<div class="preco">${R(p.preco)} <small>/${esc(p.unidade || 'un.')}</small></div>`;
  const opsHtml = () => opcoesAtuais(p).map(o => {
    const sel = s.escolhas[o.nome];
    const temCor = o.valores.some(v => v.cor);
    return `<div><div class="op-nome">${esc(o.nome)}: <b>${sel != null ? esc(o.valores[sel].nome) : 'escolha'}</b></div><div class="valores">${o.valores.map((v, i) =>
      { const eg = esgOp(p, o.nome, v); return `<button class="val ${temCor && !/bichinho/i.test(o.nome) ? 'cor' : ''} ${i === sel ? 'on' : ''}${eg ? ' esg' : ''}" data-a="opcao" data-o="${esc(o.nome)}" data-i="${i}" title="${esc(v.nome)}${eg ? ' (esgotado)' : ''}" aria-label="${esc(v.nome)}${eg ? ' (esgotado)' : ''}">${v.cor ? `<span class="bol" style="background:${v.cor}"></span>` : ''}${temCor ? '' : esc(v.nome) + (eg ? ' <small>esgotado</small>' : '')}</button>`; }).join('')}</div></div>`;
  }).join('');
  if (p.tipo === 'nome') {
    const c = p.cores[s.combo];
    h += `<div><div class="op-nome">Cor das letrinhas: <b>${esc(c.nome)}</b></div><div class="valores">${p.cores.map((x, i) =>
      `<button class="val combo ${i === s.combo ? 'on' : ''}" data-a="combo" data-i="${i}" title="${esc(x.nome)}" aria-label="${esc(x.nome)}">${tecla('A', x.base, x.letra)}</button>`).join('')}</div></div>
      ${p.modelos ? `<div><div class="op-nome">Modelo da caixeta: <b>${esc(modeloDe(p).nome)}</b></div><div class="valores">${p.modelos.map((m, i) =>
        `<button class="val ${i === (s.modelo || 0) ? 'on' : ''}" data-a="modelo" data-i="${i}">${esc(m.nome)}</button>`).join('')}</div>
        <div class="desc" style="margin-top:4px">${esc(modeloDe(p).descricao || '')}</div></div>` : ''}
      <div><div class="op-nome">Nome ou palavra${ehLisa(p) ? ` (até ${maxLetras(p)} letras)` : ''}</div><input class="nome-in" data-nome maxlength="20" value="${esc(s.nome)}" placeholder="Digite aqui" autocomplete="off"></div>
      ${opsHtml()}
      <div class="previa" data-previa>${previa(p)}</div><div data-esg>${avisoEsgotado(p)}</div>`;
  } else {
    if (kit && fotos.length) { const fa = fotoDaCombinacao(p) || opcoesAtuais(p).map(o => s.escolhas[o.nome] != null ? o.valores[s.escolhas[o.nome]].foto : null).find(Boolean) || fotos[0];
      h += `<div class="mini-foto"><img src="fotos/${esc(fa)}" alt="${esc(p.nome)}"></div>`; }
    h += opsHtml() + `<div data-esg>${avisoEsgotado(p)}</div>`;
  }
  if (!kit) h += `<div class="rodape-card">${p.tipo === 'nome' ? '' : `<div class="qtd"><button data-a="qtd" data-d="-1" aria-label="Menos">−</button><span>${s.qtd}</span><button data-a="qtd" data-d="1" aria-label="Mais">+</button></div>`}
    ${produtoEsgotado(p) ? `<a class="add consultar" target="_blank" rel="noopener" href="${linkPrazo([p.nome])}">Esgotado · consultar prazo</a>` : `<button class="add" data-a="adicionar">${p.tipo === 'nome' ? 'Adicionar nome' : 'Adicionar'}</button>`}</div>`;
  return h + `</div></article>`;
}
/* modelo de caixeta escolhido (Ondulada = cor por letra; Lisa = peça única, uma cor só) */
const modeloDe = p => p.modelos ? p.modelos[st(p).modelo || 0] : null;
const ehLisa = p => !!(modeloDe(p) && modeloDe(p).pecaUnica);
const maxLetras = p => (modeloDe(p) && modeloDe(p).maxLetras) || 20;
/* fotos que nunca podem ser cortadas (no celular aparecem inteiras, com o fundo creme dos lados) */
const ehInteira = f => (typeof FOTOS_INTEIRAS !== 'undefined' ? FOTOS_INTEIRAS : []).some(x => x.endsWith('*') ? f.startsWith(x.slice(0, -1)) : f === x);
const caixetaOp = p => { const m = modeloDe(p); return m && m.cores ? { nome: (p.opcoes || [])[0].nome, valores: m.cores } : (p.opcoes || [])[0]; };

    if (pc.tipo === 'escolha' && !pc.p) { toast(`${pc.rot}: escolha o ${pc.rotulo.split(' ')[0].toLowerCase()}`); const el = document.querySelector(`[data-escolha="${pc.i}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const it = montarItem(pc.p);
    if (!it) { const el = document.querySelector(`.card[data-p="${pc.p.id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    partes.push(it);
  }
  const letras = partes.reduce((s, x) => s + (x.letras || 0), 0), extra = Math.max(0, letras - 1), opc = opcionaisEscolhidos(), cord = comCordinha();
  carrinho.push({ kit: true, pid: k.id, nome: k.nomePedido || k.nome, qtd: 1, unit: precoKit(k, letras, opc, cord), precoBase: k.preco, letraAdicional: k.letraAdicional || 0, extra, opcionais: opc,
    semCordinha: !cord, letras, precoLetra: k.precoLetra || 0,
    inclui: k.precoLetra ? (cord ? ['letrinhas com caixeta', 'cordinha', 'pingente de brinde'] : ['letrinhas com caixeta']) : (k.inclui || []), partes: partes.map(x => ({ nome: x.nome, detalhe: x.detalhe, letras: x.letras || 0 })),
    detalhe: partes.map(x => x.nome + (x.detalhe ? ` (${x.detalhe})` : '')).join(' + '), foto: (k.fotos || [])[0] });
  salvar(); atualizarCarrinho(); fecharKit(); toast(k.precoLetra ? 'Chaveiro adicionado ao carrinho 💜' : 'Kit adicionado ao carrinho 🎁');
}
function fecharKit() { $('#kitModal').classList.remove('on'); $('#fundoKit').classList.remove('on'); document.body.style.overflow = ''; }

/* ---------- carrinho ---------- */
function contaKit(x) {
  if (x.semCordinha) {
    const p = [`${x.letras} ${x.letras === 1 ? 'letra' : 'letras'} × ${R(x.precoLetra)}`];
    for (const o of x.opcionais || []) p.push(`${o.nome} ${R(o.preco)}`);
    return p.join(' + ') + ' = ' + R(x.unit);
  }
  const partes = [x.precoLetra ? `Com cordinha e pingente (1ª letra) ${R(x.precoBase)}` : R(x.precoBase)];
  if (x.extra) partes.push(`${x.extra} letra${x.extra > 1 ? 's' : ''} a mais × ${R(x.letraAdicional)}`);
  for (const o of x.opcionais || []) partes.push(`${o.nome} ${R(o.preco)}`);
  return partes.length > 1 ? partes.join(' + ') + ' = ' + R(x.unit) : 'Valor do kit: ' + R(x.unit);

const nItens = () => carrinho.reduce((s, x) => s + x.qtd, 0);
function atualizarCarrinho() {

      : `<small>${esc(x.detalhe)}</small><small>${x.consulta ? 'preço sob consulta' : `${x.letras ? `${x.letras} letras · ` : ''}${R(unitDe(x))} cada${x.unitPix != null ? (unitDe(x) === x.unitPix ? ` (no cartão: ${R(x.unit)})` : ` (no ${esc(formasTxt())}: ${R(x.unitPix)})`) : ''}`}</small>`}</div>
    <div class="lado"><div class="qtd"><button data-a="cqtd" data-i="${i}" data-d="-1" aria-label="Menos">−</button><span>${x.qtd}</span><button data-a="cqtd" data-i="${i}" data-d="1" aria-label="Mais">+</button></div>
    <b>${x.consulta ? 'a combinar' : R(unitDe(x) * x.qtd)}</b><button class="remover" data-a="remover" data-i="${i}">remover</button></div></div>`).join('')
    : `<div class="vazio-carr"><div style="font-size:3rem">🛒</div><p>Seu carrinho está vazio.<br>Escolha suas peças e toque em <b>Adicionar</b>.</p></div>`;

    <label class="campo">Forma de pagamento<select id="cPag">${['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito'].map(o => `<option ${c.pag === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
    <label class="campo">Seu nome<input id="cNome" value="${esc(cliente.nome || '')}" placeholder="Como podemos te chamar?" autocomplete="name"></label>
    <label class="campo">Como quer receber?<select id="cEntrega">${['Retirar', 'Entrega na minha cidade', 'Envio pelos Correios', 'Ainda não sei'].map(o => `<option ${cliente.entrega === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
    <label class="campo">Cidade / bairro<input id="cCidade" value="${esc(cliente.cidade || '')}" placeholder="opcional" autocomplete="address-level2"></label>
    <label class="campo">Observação<textarea id="cObs" placeholder="opcional (ex.: é para presente)">${esc(cliente.obs || '')}</textarea></label>
    <button class="enviar" data-a="enviar"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg> Enviar pedido pelo WhatsApp</button>
    <p class="nota">O pedido abre no WhatsApp com tudo escrito. Lá a gente confirma, combina a entrega e o pagamento.</p>` : '';
  atualizarResumo();
}
function atualizarResumo() {
  const el = $('#resumo'); if (!el) return;
  const c = contas(), formas = formasTxt();
  let h = '';
  if (c.f) {
    h += `<div class="linha-tot"><span>Subtotal</span><span>${R(c.sub)}</span></div>`;
    h += c.vale ? `<div class="linha-tot verde"><span>Desconto ${esc(formas)} (${pctTxt(c.f.porcento)} em ${R(c.base)})</span><span>− ${R(c.desc)}</span></div>`

  }
  h += `<div class="total"><span>Total</span><span>${R(c.total)}</span></div>`;
  if (carrinho.some(x => x.consulta)) h += `<div class="promo-mini" style="background:#FFF1BF;color:#5b4300">Alguns itens têm <b>preço sob consulta</b>: o valor deles é combinado no WhatsApp e não está no total.</div>`;
  if (c.base > 0) h += avisoDesconto();

}
function mensagem() {
  const c = contas();
  const linhaPeca = (x, pre) => x.letras ? `${pre}${x.letras} letras (caixeta + letrinha) × ${R(x.unit / x.letras)} = ${R(x.unit)}\n` : '';
  let m = `Olá, PSN! Quero fazer um pedido:\n\n`;
  carrinho.forEach((x, i) => {
    if (x.kit) {
      m += `${i + 1}) ${x.nome}${x.qtd > 1 ? ` (${x.qtd} kits)` : ''}\n`;
      if (x.inclui && x.inclui.length) m += `   Vem: ${x.inclui.join(', ')}\n`;
      for (const pt of x.partes) m += `   • ${pt.nome}${pt.detalhe ? ' — ' + pt.detalhe : ''}\n`;
      m += `   ${contaKit(x)}${x.qtd > 1 ? ` × ${x.qtd} kits = ${R(x.unit * x.qtd)}` : ''}\n`;
      return;
    }
    m += `${i + 1}) ${x.nome}${x.detalhe ? ' — ' + x.detalhe : ''}\n`;
    m += x.consulta ? `   ${x.qtd} × (preço sob consulta)\n` : x.letras ? `   ${x.qtd > 1 ? x.qtd + ' chaveiros × ' : ''}${x.letras} letras (caixeta + letrinha) × ${R(x.unit / x.letras)} = ${R(x.unit * x.qtd)}\n` : `   ${x.qtd} × ${R(unitDe(x))} = ${R(unitDe(x) * x.qtd)}${x.unitPix != null ? (unitDe(x) === x.unitPix ? ` (preço ${formasTxt()})` : ' (preço cartão)') : ''}\n`;
  });
  m += `\nSubtotal: ${R(c.sub)}\n`;
  if (c.vale) m += `Desconto ${c.pag} (${pctTxt(c.f.porcento)} em ${R(c.base)}): − ${R(c.desc)}\n`;
  m += `*Total: ${R(c.total)}*${carrinho.some(x => x.consulta) ? ' + itens sob consulta' : ''}\n\n`;
  m += `Pagamento: ${c.pag}\n`;
  if (cliente.nome) m += `Nome: ${cliente.nome}\n`;
  m += `Receber: ${cliente.entrega || 'Retirar'}${cliente.cidade ? ' — ' + cliente.cidade : ''}\n`;
  if (cliente.obs) m += `Obs.: ${cliente.obs}\n`;
  return m;
}
function abrirCarrinho(on) { $('#gaveta').classList.toggle('on', on); $('#fundo').classList.toggle('on', on); document.body.style.overflow = on ? 'hidden' : ''; }
let tt; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1800); }

/* ---------- eventos ---------- */

    case 'combo': { s.combo = +b.dataset.i; const fi = p.fotos.indexOf(p.cores[s.combo].foto); if (fi >= 0) s.foto = fi; atualizarCard(p); break; }
    case 'opcao': {

      s.escolhas[b.dataset.o] = +b.dataset.i; const v = opcoesAtuais(p).find(o => o.nome === b.dataset.o).valores[+b.dataset.i];
      const fc = fotoDaCombinacao(p) || v.foto; if (fc && p.fotos) { const fi = p.fotos.indexOf(fc); if (fi >= 0) s.foto = fi; } atualizarCard(p); break; }

      pc.escolhido = base ? base.id : ''; pc.p = base ? clonar(kitAtual, base, pc.i + '__' + base.id, base.nome) : null; desenharKit();
      const el = document.querySelector(`[data-escolha="${pc.i}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'abrirCarrinho': abrirCarrinho(true); break;

    case 'remover': carrinho.splice(+b.dataset.i, 1); salvar(); atualizarCarrinho(); break;

const camposCli = { cNome: 'nome', cEntrega: 'entrega', cCidade: 'cidade', cObs: 'obs', cPag: 'pag' };

  `</b> no ${esc(formasTxt())}${todosNoPix() ? '' : ` em ${esc(nomesPix())}`}.`;
else $('#promo').hidden = true;
$('#zap').href = `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent('Olá, PSN! Vim pelo catálogo e tenho uma dúvida:')}`;
$('#rodape').innerHTML = `PSN · Camada por camada${LOJA.instagram ? ` · <a href="https://instagram.com/${esc(LOJA.instagram)}" target="_blank" rel="noopener">@${esc(LOJA.instagram)}</a>` : ''}<br>Pedidos pelo WhatsApp`;
